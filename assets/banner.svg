<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Gabrielle Caixeta — Desenvolvedora Back-end Java">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="240" rx="16" fill="url(#fade)"/>

  <!-- ondas decorativas -->
  <path d="M0 190 C 160 150, 300 230, 500 190 C 700 150, 850 220, 1000 180 L1000 240 L0 240 Z"
        fill="#ffffff" fill-opacity="0.07"/>
  <path d="M0 210 C 180 175, 320 245, 520 208 C 720 172, 870 235, 1000 202 L1000 240 L0 240 Z"
        fill="#ffffff" fill-opacity="0.10"/>

  <!-- chaves decorativas -->
  <text x="812" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="88" fill="#ffffff" fill-opacity="0.10">&lt;/&gt;</text>

  <text x="60" y="98" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Gabrielle Caixeta
  </text>

  <rect x="61" y="118" width="64" height="3" rx="1.5" fill="#a5b4fc"/>

  <text x="60" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="19" font-weight="500" fill="#e0e7ff" letter-spacing="0.3">
    Desenvolvedora Back-end · Java &amp; Spring Boot
  </text>

  <text x="60" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#c7d2fe" fill-opacity="0.85">
    Sistemas de Informação · APIs REST · PostgreSQL
  </text>
</svg>
