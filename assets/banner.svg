<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Gabrielle Caixeta — Desenvolvedora Back-end Java e Spring Boot">

  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b">
        <animate attributeName="stop-color"
                 values="#1e1b4b;#312e81;#1e1b4b" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#4F46E5">
        <animate attributeName="stop-color"
                 values="#4F46E5;#6366f1;#4F46E5" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#9333ea;#7C3AED" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect width="1000" height="240" rx="16"/>
    </clipPath>

    <clipPath id="typeMask">
      <rect x="60" y="132" width="0" height="28">
        <animate attributeName="width" from="0" to="450"
                 dur="1.5s" begin="0.7s" fill="freeze"
                 calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">

    <rect width="1000" height="240" fill="url(#bgA)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>

    <rect width="420" height="240" fill="url(#sheen)">
      <animateTransform attributeName="transform" type="translate"
                        from="-420 0" to="1000 0"
                        dur="7s" repeatCount="indefinite"/>
    </rect>

    <g fill="#ffffff">
      <circle cx="180" cy="46" r="2" opacity="0.35">
        <animate attributeName="cy" values="46;34;46" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="34" r="1.6" opacity="0.3">
        <animate attributeName="cy" values="34;24;34" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.75;0.3" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="58" r="2.2" opacity="0.28">
        <animate attributeName="cy" values="58;44;58" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.28;0.8;0.28" dur="7.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="196" r="1.8" opacity="0.3">
        <animate attributeName="cy" values="196;184;196" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="206" r="1.5" opacity="0.25">
        <animate attributeName="cy" values="206;196;206" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.7;0.25" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#ffffff" fill-opacity="0.07">
      <path d="M0 188 C125 158,375 218,500 188 C625 158,875 218,1000 188 C1125 158,1375 218,1500 188 C1625 158,1875 218,2000 188 L2000 260 L0 260 Z">
        <animateTransform attributeName="transform" type="translate"
                          from="0 0" to="-500 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#ffffff" fill-opacity="0.11">
      <path d="M0 210 C100 186,300 234,400 210 C500 186,700 234,800 210 C900 186,1100 234,1200 210 C1300 186,1500 234,1600 210 C1700 186,1900 234,2000 210 L2000 260 L0 260 Z">
        <animateTransform attributeName="transform" type="translate"
                          from="0 0" to="-400 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="812" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="88" fill="#ffffff" fill-opacity="0.10">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -9; 0 0" dur="6s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="fill-opacity"
               values="0.10;0.18;0.10" dur="6s" repeatCount="indefinite"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        from="-22 0" to="0 0" dur="0.9s" fill="freeze"
                        calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <text x="60" y="98" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
            font-size="46" font-weight="700" fill="#ffffff" letter-spacing="0.5">
        Gabrielle Caixeta
      </text>
    </g>

    <rect x="61" y="114" width="0" height="3" rx="1.5" fill="#a5b4fc">
      <animate attributeName="width" from="0" to="64"
               dur="0.6s" begin="0.55s" fill="freeze"
               calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>

    <g clip-path="url(#typeMask)">
      <text x="60" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
            font-size="19" font-weight="500" fill="#e0e7ff" letter-spacing="0.3">
        Desenvolvedora Full-stack · Java &amp; Spring Boot
      </text>
    </g>

    <rect x="60" y="134" width="2" height="22" fill="#c7d2fe">
      <animate attributeName="x" from="60" to="512"
               dur="1.5s" begin="0.7s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <animate attributeName="opacity" values="1;1;0;0;1"
               dur="1.1s" begin="2.2s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#c7d2fe" opacity="0">
      Sistemas de Informação · APIs REST · PostgreSQL
      <animate attributeName="opacity" from="0" to="0.85"
               dur="0.9s" begin="2.1s" fill="freeze"/>
    </text>

    <rect width="1000" height="240" rx="16" fill="none"
          stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>
</svg>
