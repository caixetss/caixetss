name: Gerar animação da cobrinha

on:
  schedule:
    # Todo dia às 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:   # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gerar os SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: caixetss
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
